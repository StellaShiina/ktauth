name = "ktauth"
main = "worker.ts"
compatibility_date = "2026-04-22"

[build]
command = """
rm -rf dist
mkdir -p dist
cp -r site/. dist/
cp ../scripts/install.sh dist/
cp ../docker-compose.yaml dist/
cp ../sql/00-init.sql dist/
cp ../.env.example dist/
"""

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = true
