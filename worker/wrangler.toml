name = "ktauth"
main = "worker.ts"
compatibility_date = "2026-04-22"

[build]
command = "node build.mjs"
watch_dir = ["site", "../scripts", "../docker-compose.yaml", "../sql", "../.env.example"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[observability]
enabled = true
